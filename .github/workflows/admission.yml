name: Multiplayer admission
on: [push, pull_request]
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest lupa
      - run: python -m pytest tests/test_admission.py tests/test_admission_bindings.py -q
